name: Web release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm test
      - name: Package standalone site
        run: |
          mkdir -p dist
          cp LICENSE web/LICENSE
          cd web
          zip -r ../dist/TheoryDictationMaster-Web.zip .
          cd ../dist
          sha256sum TheoryDictationMaster-Web.zip > TheoryDictationMaster-Web.zip.sha256
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --title "Theory Dictation Master $GITHUB_REF_NAME | Web edition" --notes-file docs/RELEASE.md
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
